<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0d0d0d"/>
      <stop offset="100%" style="stop-color:#111827"/>
    </linearGradient>
    <linearGradient id="accent-line" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#6366f1"/>
      <stop offset="100%" style="stop-color:#06b6d4"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg)"/>

  <!-- Subtle grid pattern -->
  <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
    <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#ffffff" stroke-width="0.3" opacity="0.05"/>
  </pattern>
  <rect width="1200" height="630" fill="url(#grid)"/>

  <!-- Accent glow top-left -->
  <ellipse cx="100" cy="100" rx="300" ry="200" fill="#6366f1" opacity="0.06"/>
  <!-- Accent glow bottom-right -->
  <ellipse cx="1100" cy="530" rx="250" ry="150" fill="#06b6d4" opacity="0.06"/>

  <!-- Top accent bar -->
  <rect x="80" y="72" width="120" height="4" rx="2" fill="url(#accent-line)"/>

  <!-- Name -->
  <text x="80" y="200" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="72" font-weight="700" fill="#ffffff" letter-spacing="-1">Danny Barahona</text>

  <!-- Title -->
  <text x="80" y="272" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="32" font-weight="400" fill="#6366f1" letter-spacing="0.5">Senior Mobile &amp; Full-Stack Engineer</text>

  <!-- Divider -->
  <rect x="80" y="310" width="1040" height="1" fill="#ffffff" opacity="0.08"/>

  <!-- Tech stack chips -->
  <!-- Flutter -->
  <rect x="80" y="340" width="102" height="36" rx="18" fill="#6366f1" opacity="0.15"/>
  <text x="131" y="363" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="15" font-weight="600" fill="#a5b4fc" text-anchor="middle">Flutter</text>

  <!-- React Native -->
  <rect x="196" y="340" width="148" height="36" rx="18" fill="#06b6d4" opacity="0.12"/>
  <text x="270" y="363" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="15" font-weight="600" fill="#67e8f9" text-anchor="middle">React Native</text>

  <!-- NestJS -->
  <rect x="358" y="340" width="98" height="36" rx="18" fill="#e11d48" opacity="0.12"/>
  <text x="407" y="363" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="15" font-weight="600" fill="#fda4af" text-anchor="middle">NestJS</text>

  <!-- Laravel -->
  <rect x="470" y="340" width="100" height="36" rx="18" fill="#f97316" opacity="0.12"/>
  <text x="520" y="363" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="15" font-weight="600" fill="#fdba74" text-anchor="middle">Laravel</text>

  <!-- AWS -->
  <rect x="584" y="340" width="76" height="36" rx="18" fill="#eab308" opacity="0.12"/>
  <text x="622" y="363" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="15" font-weight="600" fill="#fde047" text-anchor="middle">AWS</text>

  <!-- Available badge -->
  <rect x="80" y="420" width="290" height="40" rx="8" fill="#6366f1" opacity="0.18"/>
  <circle cx="108" cy="440" r="6" fill="#22c55e"/>
  <text x="124" y="445" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="15" font-weight="500" fill="#c7d2fe">Open to senior remote roles</text>

  <!-- Stats row -->
  <text x="80" y="530" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="18" font-weight="700" fill="#ffffff">5+ years</text>
  <text x="80" y="555" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="13" fill="#6b7280">Experience</text>

  <text x="240" y="530" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="18" font-weight="700" fill="#ffffff">16K+ users</text>
  <text x="240" y="555" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="13" fill="#6b7280">Production apps</text>

  <text x="420" y="530" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="18" font-weight="700" fill="#ffffff">US · EC · LATAM</text>
  <text x="420" y="555" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="13" fill="#6b7280">Client markets</text>

  <!-- URL -->
  <text x="1120" y="555" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="14" fill="#4b5563" text-anchor="end">korbold.vercel.app</text>

  <!-- Bottom accent bar -->
  <rect x="0" y="622" width="1200" height="8" fill="url(#accent-line)" opacity="0.6"/>
</svg>
